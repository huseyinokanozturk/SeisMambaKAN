# configs/paths.yaml
#
# All environment-specific paths live here. Code never hardcodes paths;
# it reads them from this file via src.utils.env_paths().
#
# Two "environments":
#   - local   : developer machine (Windows/macOS/Linux IDE), used for editing.
#   - colab   : Google Colab runtime; data is copied from Drive at setup time.
#
# Drive is a *storage backend* shared between local and colab — used for
# processed data, mirrored experiments, and result artifacts.

# =====================================================================
# RAW + PROCESSED DATA PATHS (relative to project root in local/colab)
# =====================================================================
data:
  # Directory containing raw CSV files (only used by preprocess.py)
  raw_csv_dir: "data/raw/csv"
  # Directory containing raw HDF5 files (only used by preprocess.py)
  raw_hdf5_dir: "data/raw/hdf5"

  # STEAD dataset chunk configuration
  stead:
    noise_chunks: ["chunk1"]
    eq_chunks: ["chunk2", "chunk3", "chunk4", "chunk5", "chunk6"]

# =====================================================================
# PROCESSED DATA DIRECTORY STRUCTURE (WebDataset .tar shards)
# Resolved by dataset.py -> _get_split_dir() relative to CWD.
# In Colab these are populated by `run.py data` from Drive.
# =====================================================================
processed:
  all:
    train_dir: "data/processed/all/train"
    val_dir:   "data/processed/all/val"
    test_dir:  "data/processed/all/test"
  sample:
    train_dir: "data/processed/sample/train"
    val_dir:   "data/processed/sample/val"
    test_dir:  "data/processed/sample/test"

# =====================================================================
# WEBDATASET CONFIGURATION
# =====================================================================
webdataset:
  shard_size: 2048
  train_pattern: "train_{:06d}.tar"
  val_pattern:   "val_{:06d}.tar"
  test_pattern:  "test_{:06d}.tar"

# =====================================================================
# EXPERIMENTS (training output) — local + mirrored on Drive
# =====================================================================
experiments:
  # Local (Colab cwd or local dev) root for experiments/exp_XXX
  root_dir: "experiments"
  # Drive mirror; written to during training (set to null to disable mirroring)
  drive_root_dir: "/content/drive/MyDrive/Proje_SeisMamba/SeisMambaKAN/experiments"

# =====================================================================
# RESULTS (eval / inference artifacts) — local + mirrored on Drive
# =====================================================================
results:
  root_dir: "results"
  drive_root_dir: "/content/drive/MyDrive/Proje_SeisMamba/SeisMambaKAN/results"

# =====================================================================
# DRIVE — single source of truth for Drive-side paths used by run.py
# =====================================================================
drive:
  project_root:  "/content/drive/MyDrive/Proje_SeisMamba/SeisMambaKAN"
  data_dir:      "/content/drive/MyDrive/Proje_SeisMamba/SeisMambaKAN/data/processed"
  experiments_dir: "/content/drive/MyDrive/Proje_SeisMamba/SeisMambaKAN/experiments"
  results_dir:   "/content/drive/MyDrive/Proje_SeisMamba/SeisMambaKAN/results"
  wheels_dir:    "/content/drive/MyDrive/Proje_SeisMamba/SeisMambaKAN/wheels"

# =====================================================================
# COLAB — runtime layout
# =====================================================================
colab:
  project_root: "/content/SeisMambaKAN"
  git_repo_url: "https://github.com/huseyinokanozturk/SeisMambaKAN.git"
  # Torch wheel target (must match wheels stored under drive.wheels_dir)
  target_torch_version: "2.5.1+cu121"
  mamba_wheel_name:  "mamba_ssm-2.2.6.post3-cp312-cp312-linux_x86_64.whl"
  causal_wheel_name: "causal_conv1d-1.5.3.post1-cp312-cp312-linux_x86_64.whl"
