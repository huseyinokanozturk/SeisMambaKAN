model:
  name: "SeisMambaKAN"
  input_channels: 3          # Input shape: (B, 3, 6000)
  input_length: 6000
  backbone: "mamba_unet_1d"  # Custom backbone defined in network.py
  normalization: "layernorm"
  activation: "silu"
  dropout: 0.10
  use_channels_last: false   # Optional: used by training loop for memory optimization

  # Mixed precision (Phase 4). On A100/H100 bf16 is the right choice; Mamba
  # is numerically unstable in fp16. If the runtime GPU does not support
  # bf16 (e.g. T4 / Turing) the trainer auto-disables AMP rather than
  # falling back to fp16 — so this config is safe on both A100 and T4.
  use_amp: true
  amp_dtype: "bfloat16"      # "bfloat16" (A100/H100) or "float16" (older GPUs)

# ============================================================
# ENCODER: 1D U-Net + Mamba Architecture
# (Phase 3: widened channels, bigger Mamba, lighter bottleneck.)
# ============================================================
encoder:
  stem:
    out_channels: 32         # Phase 3.1: 16 -> 32 (richer initial features)
    kernel_size: 7
    stride: 1
    padding: 3
    bias: true

  # Progressive downsampling: 6000 → 6000 → 3000 → 1500 → 750 → 375
  stages:
    - name: "enc_stage_0"
      d_model: 48            # Phase 3.1: 16 -> 48
      n_layers: 1
      downsample_factor: 1   # Maintains resolution: 6000 → 6000
      use_mamba: true

    - name: "enc_stage_1"
      d_model: 64            # Phase 3.1: 24 -> 64
      n_layers: 2
      downsample_factor: 2   # First downsampling: 6000 → 3000
      use_mamba: true

    - name: "enc_stage_2"
      d_model: 96            # Phase 3.1: 32 -> 96
      n_layers: 2
      downsample_factor: 2   # Second downsampling: 3000 → 1500
      use_mamba: true

    - name: "enc_stage_3"
      d_model: 128           # Phase 3.1: 48 -> 128
      n_layers: 2
      downsample_factor: 2   # Third downsampling: 1500 → 750
      use_mamba: true

    - name: "bottleneck"
      d_model: 192           # Phase 3.1: 64 -> 192
      n_layers: 2            # Phase 3.4: 3 -> 2 layers (paired with stronger d_state/expand)
      downsample_factor: 2   # Final downsampling: 750 → 375
      use_mamba: true

  mamba:
    d_state: 32              # Phase 3.4: 16 -> 32
    expand_factor: 2.0       # Phase 3.4: 1.5 -> 2.0
    conv_kernel: 4
    dropout: 0.10
    bias: true
    use_fast_path: true
    layer_norm_eps: 1e-5

# ============================================================
# DECODER: U-Net Upsampling + sparse KAN integration
# (Phase 3.2: KAN only on the final, full-resolution stage + a
#  pre-head KAN block. Other stages use ConvNormAct1d, which is
#  cheaper and easier to optimize given much wider channels.)
# ============================================================
decoder:
  upsample_mode: "conv_transpose"
  concat_skips: true               # U-Net style skip connections

  stages:
    - name: "dec_stage_3"
      d_model: 128                 # Phase 3.1
      n_layers: 1
      upsample_factor: 2
      skip_from: "enc_stage_3"
      use_kan: false               # Phase 3.2: ConvNormAct1d here

    - name: "dec_stage_2"
      d_model: 96                  # Phase 3.1
      n_layers: 1
      upsample_factor: 2
      skip_from: "enc_stage_2"
      use_kan: false               # Phase 3.2: ConvNormAct1d here

    - name: "dec_stage_1"
      d_model: 64                  # Phase 3.1
      n_layers: 1
      upsample_factor: 2
      skip_from: "enc_stage_1"
      use_kan: false               # Phase 3.2: ConvNormAct1d here

    - name: "dec_stage_0"
      d_model: 48                  # Phase 3.1
      n_layers: 1
      upsample_factor: 2
      skip_from: "enc_stage_0"
      skip_stem: true              # Phase 3.3: extra stem-level skip for sharp P
      use_kan: true                # Phase 3.2: keep KAN only at final stage

  # Phase 3.2/3.3: extra non-linear capacity right before the heads.
  pre_head_kan:
    enabled: true
    n_layers: 1

  kan:
    hidden_factor: 2.0
    grid_size: 3
    spline_order: 3
    base_activation: "silu"
    dropout: 0.10
    bias: true
    apply_per_timestep: true

# ============================================================
# OUTPUT HEADS: Detection + P-wave + S-wave Prediction
# ============================================================
heads:
  shared:
    in_channels: 48       # Phase 3.1: matches dec_stage_0 output (C=48)
    kernel_size: 1
    bias: true

  detection:
    type: "ConvHead1D"
    # Head outputs LOGITS (no sigmoid). BCEWithLogitsLoss in losses.py.
    out_channels: 1
    activation: "none"
    target: "detection"
    loss: "bce"

  p_gaussian:
    type: "ConvHead1D"
    out_channels: 1
    activation: "none"
    target: "p_gaussian"
    loss: "mse"

  s_gaussian:
    type: "ConvHead1D"
    out_channels: 1
    activation: "none"
    target: "s_gaussian"
    loss: "mse"

# ============================================================
# REGULARIZATION & TRAINING CONFIGURATION
# ============================================================
regularization:
  weight_decay: 0.01
  dropout: 0.10

  label_smoothing:
    detection: 0.0
    p_gaussian: 0.0
    s_gaussian: 0.0

# Phase 3.5: kaiming_normal is the right choice for ReLU/SiLU-style
# activations and wider channels (xavier_uniform was tuned for a smaller
# tanh/sigmoid-era architecture). Mamba/KAN keep their own internal init.
init:
  type: "kaiming_normal"
  gain: 1.0
