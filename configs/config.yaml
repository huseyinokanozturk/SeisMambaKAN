# =====================================================================
# Global configuration for SeisMambaKAN
# =====================================================================

# -----------------------------
# DATASET CONFIGURATION
# -----------------------------
data:
  # Dataset mode: "all" uses the full cleaned dataset,
  # "sample" uses a smaller subset mainly for debugging and smoke tests.
  # Default is "sample" so a fresh checkout is smoke-test friendly out of
  # the box. Switch to "all" once you've run `python run.py setup
  # --data-mode all` (or `python run.py data --mode all`) at least once.
  mode: "sample"           # "all" or "sample"

  # Total number of samples to draw when mode == "sample".
  sample_size: 1300

  # Fraction of earthquake samples within the sample subset.
  # For example, eq_ratio=0.75 → 75% earthquakes, 25% noise.
  eq_ratio: 0.75

  # Whether to include noise traces in the dataset at all.
  use_noise: true

  # Raw signal properties (STEAD default)
  sampling_rate_hz: 100    # STEAD is 100 Hz
  window_seconds: 60       # 60 s window → 6000 samples
  n_channels: 3            # typically (E, N, Z) or similar

# -----------------------------
# DATA SPLIT CONFIGURATION
# -----------------------------
split:
  # Fractions for train/validation/test splits.
  train: 0.8
  val: 0.1
  test: 0.1

# -----------------------------
# CLEANING / QUALITY FILTERS
# -----------------------------
cleaning:
  # Acceptable P–S time difference in seconds.
  min_ps_seconds: 0.5
  max_ps_seconds: 35.0

  # Whether to allow missing S picks (future extension).
  allow_missing_s: false

  # Whether to drop records with missing P picks.
  drop_if_missing_p: true

  # Valid range for P/S arrival sample indices within the window.
  window_samples:
    min: 0
    max: 6000

# -----------------------------
# PREPROCESSING (ON WAVEFORM)
# -----------------------------
preprocessing:
  # Only amplitude normalization is applied.
  # STEAD already performed detrend + bandpass filtering.
  # Options: "zscore", "maxabs", "none"
  normalization: "zscore"

# =====================================================================
# LABEL GENERATION CONFIGURATION
# =====================================================================
labels:
  # Total time steps used for label generation (should match window length).
  total_length: 6000

  # Detection head target (Phase 7):
  # Binary BOX label covering the event window [P - margin, S + margin].
  # SeisConformer uses margin = 50 samples (0.5 s @ 100 Hz) on each side.
  # Gaussian σ=10 from Phase 1.2 starved the detection head of
  # event-context (it only saw a 100 ms ring around P/S); SC's box label
  # gives the full event window 1.0 supervision and dramatically improves
  # detection f1 + provides a real mask for the phase loss.
  detection:
    type: "box"           # Phase 7: was "gaussian"

    # Legacy fields kept so older callers / inspectors don't break; the
    # active dataset.py path (Phase 7) consumes margin_samples only.
    sigma_samples: 10.0
    peak_value: 1.0

    # Half-width of the box on each side of P/S, in samples (100 Hz).
    # Phase 7: 50 samples = 0.5 s, matching SC `_make_labels`.
    margin_samples: 50

  # Phase picking heads for P and S phases.
  phase:
    # P-phase Gaussian label parameters. 10 samples = 100ms (Phase 1.2).
    p_sigma_samples: 10.0
    # S-phase Gaussian label parameters.
    s_sigma_samples: 10.0

    # Peak value for both P and S Gaussian labels.
    peak_value: 1.0

  # How to represent noise traces (without P/S picks).
  noise_policy:
    # Index values used when P or S is not available (e.g., noise traces).
    # -1 means "no valid pick".
    p_index: -1
    s_index: -1

# =====================================================================
# DATA AUGMENTATION CONFIGURATION
# =====================================================================
augmentation:
  # Global switch to enable/disable all augmentations.
  enable: true

  # -------------------------
  # Random time shift  (Phase 7: REVERTED to SC level)
  # -------------------------
  # Phase 2.1 widened this to 3000 samples assuming "more shift = better
  # generalization"; the SeisConformer code base (which beats EQT on this
  # dataset) uses 30 samples (0.3 s). The wide setting pushed events
  # off-window in a large fraction of batches and is now believed to be
  # the source of the long-tail P/S outliers observed in exp_002.
  random_shift:
    prob: 0.75
    max_shift_samples: 30      # Phase 7: 3000 -> 30 (SC level)

  # -------------------------
  # Additive noise  (Phase 7: REVERTED to fixed std)
  # -------------------------
  # Phase 2.2 randomized std in [0.05, 0.30]; SC uses fixed std=0.05.
  # The wider range was over-aggressive on z-score-normalized STEAD and
  # likely contributed to outlier picks.
  additive_noise:
    prob: 0.7
    std: 0.05                  # Phase 7: single fixed std (SC level)

  # -------------------------
  # Amplitude scaling  (Phase 7: REVERTED to SC level)
  # -------------------------
  amplitude_scale:
    prob: 0.5
    min: 0.9                   # Phase 7: 0.5 -> 0.9
    max: 1.1                   # Phase 7: 2.0 -> 1.1

  # -------------------------
  # Channel dropout  (Phase 7: REVERTED to SC level)
  # -------------------------
  channel_dropout:
    prob: 0.1                  # Phase 7: 0.2 -> 0.1
    num_channels_choices: [1]

  # -------------------------
  # Secondary event injection  (Phase 2.5)
  # -------------------------
  # Mix another EQ waveform from the pool into the current sample. Labels
  # remain on the PRIMARY event; the injected event acts as structured
  # noise. This is one of the strongest augmentations for phase-picker
  # robustness (EQTransformer uses it).
  secondary_event:
    enable: true               # was false
    probability: 0.3           # was 0.4 (kept slightly lower for stability)
    scale_min: 0.1             # was 0.05
    scale_max: 0.5             # was 0.2
    min_offset_samples: 400
    pool_max: 300              # buffer size for primary events to reuse

# =====================================================================
# TRAINING & DATALOADER CONFIGURATION
# (Phase 4: A100 production preset. Smoke-test on T4 with
#  `python run.py train --epochs 5 --batch-size 64`.)
# =====================================================================
training:
  # Global random seed used for reproducibility.
  seed: 42

  # A100 / 90 GB-STEAD production batch size. The Phase 3 architecture
  # (~2-3M params, wider Mamba) fits comfortably at 128 on A100 with bf16
  # autocast. Override with --batch-size for T4 smoke runs.
  batch_size: 128

  # Production length. Combined with patience=12 early stopping, real
  # convergence happens well before this; this is the upper bound.
  epochs: 100

  # Peak / target learning rate. With scheduler=onecycle this is max_lr.
  learning_rate: 3.0e-4

  # --- Stability knobs (Phase 0) ---
  # Gradient L2 norm clip applied after scaler.unscale_; 0 or null disables.
  grad_clip_max_norm: 1.0

  # LR scheduler. "onecycle" -> OneCycleLR; "none" -> no scheduler.
  scheduler: "onecycle"
  scheduler_pct_start: 0.05          # OneCycleLR warmup fraction
  scheduler_div_factor: 25.0         # initial_lr = max_lr / div_factor
  scheduler_final_div_factor: 1.0e4  # min_lr   = initial_lr / final_div_factor

  # NaN/Inf guard: skip step on non-finite loss; abort after N consecutive.
  nan_threshold: 10

  # --- Early stopping (Phase 2.5) ---
  # Stop training when the monitored validation metric does not improve for
  # `patience` consecutive epochs. `min_delta` is the smallest improvement
  # that resets the patience counter. `monitor` keys: total | detection | p | s.
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 1.0e-4
    monitor: "total"

  # --- EMA weights (Phase 4) ---
  # Exponential moving average of model parameters. Validation and best-model
  # save use the EMA snapshot; this smooths OneCycleLR's end-of-training
  # oscillation and is the standard cheap half-percent gain.
  ema:
    enabled: true
    decay: 0.999

dataloader:
  # Number of worker processes for PyTorch DataLoader.
  num_workers: 12

  # Whether to pin memory to speed up host-to-device transfers.
  pin_memory: true

  # Whether to keep workers alive between epochs.
  persistent_workers: true

  # Number of batches prefetched by each worker.
  prefetch_factor: 4

  # Whether to drop the last (possibly incomplete) batch during training.
  drop_last: true

  # Whether to shuffle the training dataset each epoch.
  shuffle_train: true

# =====================================================================
# LOSS FUNCTION CONFIGURATION
# =====================================================================

loss:
  # High-level type for logging / debugging
  type: "multi_head_seismambakan"

  # Which keys in the label dict correspond to each head
  keys:
    detection: "y_det"
    p: "y_p"
    s: "y_s"

  # Global weights for each head in the final loss:
  #   L_total = w_det * L_det + w_p * L_p + w_s * L_s
  # Phase 7: match SeisConformer's exact ratio (0.4 / 1.0 / 1.2).
  # Combined with peak_w=100/150 below, this gives the phase heads a
  # large enough absolute gradient that the model actually focuses on
  # the peak instead of the tails. Previous 0.1/0.3/0.4 was an order
  # of magnitude lower than what SC needed to reach 19 ms P MAE.
  weights:
    detection: 0.4    # lambda_det (Phase 7: was 0.1)
    p: 1.0            # lambda_P   (Phase 7: was 0.3)
    s: 1.2            # lambda_S   (Phase 7: was 0.4)

  # --------------------------------------------------------------------------
  # Detection head loss: weighted BCE (optionally focal)
  # --------------------------------------------------------------------------
  detection:
    loss_type: "bce"        # ["bce", "focal_bce"] – plain BCE
    positive_weight: 1.0    # weight for y=1 samples to handle imbalance
    use_focal: false        # if true, use focal variant instead of plain BCE
    focal_alpha: 0.25       # only used when use_focal = true
    focal_gamma: 2.0        # focusing parameter for focal loss
    eps: 1.0e-7             # numerical stability for log / clamp

  # --------------------------------------------------------------------------
  # Phase heads loss: detection-masked, peak-weighted MSE on Gaussian targets
  # --------------------------------------------------------------------------
  phase:
    loss_type: "masked_peak_mse"
    # Peak weighting: w_t = 1 + peak_weight * y_phase(t).
    # Phase 7: SeisConformer uses peak_weight=100 for P and 150 for S.
    # The previous shared scale=5 gave near-zero gradient at the peak,
    # which is the timestep that determines arrival-time error. The
    # bounded sigmoid head + per-sample mask normalization keep the
    # weighted loss numerically stable at this magnitude.
    p_peak_weight: 100.0          # Phase 7 (SC level)
    s_peak_weight: 150.0          # Phase 7 (SC level — S harder)
    use_detection_mask: true      # multiply by detection label to focus on event window
    normalize_by_mask: true       # per-sample mask normalization (Phase 1.1)
    # Phase 7: head activation is now sigmoid (model_config.yaml), so the
    # clamp is mathematically redundant. Keep it on as a no-op safety
    # belt (clamping a [0,1] sigmoid output to [0,1] is free).
    clamp_predictions: true
    clamp_min: 0.0
    clamp_max: 1.0
    eps: 1.0e-6                   # for safe normalization

  # --------------------------------------------------------------------------
  # Optional center-based loss (soft-argmax on P/S), disabled.
  # Re-enable only after the baseline masked-MSE loss is stable; soft-argmax
  # adds an arrival-time L1 term whose scale is hard to reconcile early on.
  # --------------------------------------------------------------------------
  center_loss:
    enabled: false        # Phase 1.4: disabled until baseline is stable.
    weight: 0.05          # lambda_center; non-zero only if enabled = true
    temperature: 10.0     # controls sharpness of soft-argmax over time axis

metrics:
  # ============================================================================
  # General Settings
  # ============================================================================
  sample_rate: 100.0              # Sampling frequency in Hz (STEAD default).
  window_length: 6000             # Number of samples per waveform segment.

  # ============================================================================
  # Detection Evaluation Settings
  # ============================================================================
  detection:
    # Threshold for deciding whether a trace contains an earthquake event.
    # If max(det_prob) >= trace_threshold → event is detected.
    trace_threshold: 0.8

    # Threshold used for per-sample (time-step) binary classification
    # when computing frame-level precision/recall/F1.
    timestep_threshold: 0.7

  # ============================================================================
  # Phase Picker Settings (Phase 7: SeisConformer-style multi-criteria)
  # ============================================================================
  # The previous (Phase 5) union-band + parabolic picker has been replaced
  # with a direct port of SC's picker.py V7:
  #   1. Smooth detection trace (sigma=2), adaptive threshold
  #      mean + 0.3*std, max(base, adaptive).
  #   2. Find event segments (above-threshold contiguous regions); clip
  #      any segment longer than max_segment_sec.
  #   3. Per segment: multi-criteria P search with temporal bonus
  #      (prefer P within first ~3 s of detection); hybrid S search with
  #      gradient + P-decay + P-S-gap scoring.
  #   4. Gaussian-weighted center-of-mass refinement (more stable than
  #      parabolic at low SNR — verified by SC on STEAD).
  picker:
    # Base detection threshold used as floor for the adaptive threshold.
    det_threshold: 0.5

    # Base P/S amplitude thresholds (used as floor for per-segment
    # adaptive thresholds via SC's `mean + 0.3*std` rule).
    p_threshold: 0.25
    s_threshold: 0.25

    # SC's smoothing sigmas for each trace (in samples).
    smooth_sigma_det: 2.0
    smooth_sigma_p: 1.0
    smooth_sigma_s: 1.2

    # Adaptive-threshold k: th = max(base, mean + k * std).
    adaptive_k: 0.3

    # Event-segmentation parameters (samples / seconds).
    min_segment_gap_sec: 1.0
    max_segment_sec: 30.0

    # Refinement window (+/- samples) for SC's Gaussian-weighted COM refine.
    refine_window_samples: 3

    # P-search window relative to detection start (seconds).
    p_search_back_sec: 1.0      # allow P up to 1 s before detection start
    p_search_forward_sec: 10.0  # search at most 10 s after detection start
    p_min_distance_sec: 0.2     # minimum peak-distance for find_peaks
    p_temporal_bonus_3s: 0.3    # bonus if P is within 3 s of detection start
    p_temporal_bonus_5s: 0.2    # bonus if P is within 5 s of detection start
    p_temporal_bonus_far: 0.1   # bonus if P is further than 5 s

    # S-search parameters.
    s_min_distance_sec: 0.3
    s_search_pad_sec: 5.0       # extend search past detection end by this much
    min_ps_diff_sec: 0.1
    max_ps_diff_sec: 40.0

    # Edge guard (samples): reject picks within this many samples of either
    # window boundary.
    edge_guard_samples: 100

  # ============================================================================
  # Phase Pick Error Tolerances (Used for Reporting Accuracy)
  # ============================================================================
  phase_tolerance:
    # Thresholds (in seconds) used for computing hit-rate statistics.
    # Example:
    #   hit_rate_small = percentage(|error| < small)
    #   hit_rate_medium = percentage(|error| < medium)
    #   hit_rate_large = percentage(|error| < large)
    p:
      small: 0.01
      medium: 0.02
      large: 0.05

    s:
      small: 0.01
      medium: 0.02
      large: 0.05

    # Phase 7: pick-level F1 tolerance. A pick is counted as TP iff
    # |pred - gt| <= pick_tolerance_sec. EQTransformer's published Table
    # 2/3 use 0.5 s (50 samples @ 100 Hz); we adopt the same so our
    # precision/recall/F1 are directly comparable to EQT.
    pick_tolerance_sec: 0.5

  # ============================================================================
  # Evaluation Output Configuration
  # ============================================================================
  eval:
    # Number of batches to evaluate. If null, the entire validation/test
    # dataset will be used.
    max_batches: null

    # Save final aggregated metrics as JSON (e.g., val_metrics.json).
    save_json: true

    # If true, save per-trace metrics (detection outcome, P/S picks, errors)
    # into a CSV file for detailed analysis.
    save_per_trace_csv: false

    # Directory name (within the experiment folder) where evaluation outputs
    # will be stored.
    output_dir: "metrics"
